interface:
  display_name: "Frontend Development Playbook"
  short_description: "Build professional web apps with clear frontend standards"
  default_prompt: "Use $frontend-development-playbook to build maintainable frontend work within the existing stack and UI shell. Keep shared UI packages presentation-only, consume released versions, and surface real API failures rather than silent demo fallbacks. 新项目或统一规范时同时遵循 $project-standards-playbook，保留已有项目参数。"
